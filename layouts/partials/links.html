<div class="split-lists">
  {{ range $key, $value := .Site.Params.links }} {{ range $key, $list := $value }} {{ if $list.link
  }}
  <div class="split-list">
    <h3>{{ $list.heading }}</h3>
    <ul>
      {{ range $list.link }}
      <li><a href="{{ .url }}">{{ .text }}</a></li>
      {{ end }}
    </ul>
  </div>
  {{ end }} {{ end }} {{ end }}
</div>

<div class="split-kofi">
  <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script><script type='text/javascript'>kofiwidget2.init('Support the team on Ko-fi', '#72a4f2', 'P5X123UATT');kofiwidget2.draw();</script>
</div>
